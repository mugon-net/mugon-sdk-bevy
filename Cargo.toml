[package]
name = "mugon-sdk-bevy"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Bevy integration for games running on the Mugon platform"
repository = "https://github.com/mugon-net/mugon-sdk-bevy"
homepage = "https://github.com/mugon-net/mugon-sdk-bevy"
readme = "README.md"
keywords = ["bevy", "gamedev", "multiplayer", "wasm", "mugon"]
categories = ["game-development", "wasm"]
include = ["src/**/*", "README.md", "LICENSE-MIT", "Cargo.toml"]

[lib]
crate-type = ["rlib"]

[features]
serde = ["dep:serde"]
loading = ["dep:bevy_asset"]
scene = ["dep:bevy_math", "dep:bevy_transform"]
avian = [
    "scene",
    "dep:avian3d",
    "dep:bevy_asset",
    "dep:bevy_log",
    "dep:bevy_mesh",
    "dep:bevy_world_serialization",
]
# A behaviour for UI entities that emit `Activate` (any `bevy_ui_widgets` button, or a themed one from mugon-sdk-ui-bevy).
fullscreen = ["dep:bevy_ui_widgets"]

[dependencies]
bevy_app = "0.20.1"
bevy_ecs = "0.20.1"
bytes = "1.12.1"
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"

serde = { version = "1", optional = true, default-features = false, features = ["std"] }
bevy_asset = { version = "0.20.1", optional = true }
bevy_math = { version = "0.20.1", optional = true }
bevy_ui_widgets = { version = "0.20.1", optional = true }
bevy_transform = { version = "0.20.1", optional = true }
bevy_log = { version = "0.20.1", optional = true }
bevy_mesh = { version = "0.20.1", optional = true }
bevy_world_serialization = { version = "0.20.1", optional = true }
avian3d = { version = "0.8.0", optional = true, default-features = false, features = ["3d", "parry-f32", "collider-from-mesh"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom4 = { version = "0.4.3", package = "getrandom", features = ["wasm_js"] }
