[package]
name = "mugon-sdk-bevy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bevy integration for games running on the Mugon platform"
repository = "https://github.com/mugon-net/mugon-sdk-bevy"
homepage = "https://github.com/mugon-net/mugon-sdk-bevy"
readme = "README.md"
keywords = ["bevy", "gamedev", "multiplayer", "wasm", "mugon"]
categories = ["game-development", "wasm"]
include = ["src/**/*", "README.md", "LICENSE-MIT", "Cargo.toml"]

[lib]
crate-type = ["rlib"]

[features]
serde = ["dep:serde"]
loading = ["dep:bevy_asset"]
scene = ["dep:bevy_math", "dep:bevy_transform"]
avian = [
    "scene",
    "dep:avian3d",
    "dep:bevy_asset",
    "dep:bevy_log",
    "dep:bevy_mesh",
    "dep:bevy_world_serialization",
]
touch-controls = [
    "dep:bevy_input",
    "dep:bevy_math",
    "dep:bevy_ui",
    "dep:bevy_window",
    "dep:encase_derive_impl",
    "dep:web-sys",
]

[dependencies]
bevy_app = "0.19.1"
bevy_ecs = "0.19.1"
bytes = "1.12.1"
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"

serde = { version = "1", optional = true, default-features = false, features = ["std"] }
bevy_asset = { version = "0.19.1", optional = true }
bevy_input = { version = "0.19.1", optional = true, features = ["mouse", "touch"] }
bevy_math = { version = "0.19.1", optional = true }
bevy_ui = { version = "0.19.1", optional = true }
bevy_window = { version = "0.19.1", optional = true }
bevy_transform = { version = "0.19.1", optional = true }
bevy_log = { version = "0.19.1", optional = true }
bevy_mesh = { version = "0.19.1", optional = true }
bevy_world_serialization = { version = "0.19.1", optional = true }
avian3d = { version = "0.7.0", optional = true, default-features = false, features = ["3d", "parry-f32", "collider-from-mesh"] }
# Pinned: 0.12.2's proc-macro pulls in syn 3, which conflicts with bevy_encase_derive 0.19.1.
encase_derive_impl = { version = "=0.12.1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom4 = { version = "0.4.3", package = "getrandom", features = ["wasm_js"] }
web-sys = { version = "0.3", optional = true, features = ["Navigator", "Window"] }
